<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FORMA EDU | Inquiry Admin</title>
  <style>
    :root{--ink:#10261f;--muted:#5d7066;--paper:#f5f7f2;--panel:#fff;--line:#cad6c9;--accent:#e95d3f}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 Arial,Helvetica,sans-serif}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}header{border-bottom:1px solid var(--line);background:var(--panel)}.top{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:800;letter-spacing:.04em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:3px;padding:10px 14px;font-weight:700}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.main{padding:42px 0}.login{max-width:420px;margin:60px auto;background:var(--panel);border:1px solid var(--line);padding:28px}.login h1,.toolbar h1{margin:0 0 8px;font-size:30px}.muted{color:var(--muted)}label{display:grid;gap:7px;margin:20px 0;font-weight:700}input,select{width:100%;border:1px solid #91a398;border-radius:3px;padding:11px;background:#fbfdf9}.error{color:#b73724;margin-top:12px}.hidden{display:none!important}.toolbar{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.filters{display:flex;gap:10px;align-items:center}.table-wrap{overflow:auto;background:var(--panel);border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:860px}th,td{text-align:left;vertical-align:top;padding:14px;border-bottom:1px solid var(--line)}th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}td{font-size:13px}td.message{white-space:pre-wrap;max-width:350px}.badge{display:inline-block;padding:4px 8px;background:#e5edde;border-radius:999px;font-size:11px;font-weight:700}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:700px){.toolbar{align-items:flex-start;flex-direction:column}.filters{width:100%}.filters select{flex:1}}
  </style>
</head>
<body>
  <header><div class="wrap top"><a class="brand" href="../">FORMA EDU<small>Inquiry admin</small></a><button id="logout" class="hidden">退出登录 / Log out</button></div></header>
  <main class="wrap main"><section id="loginPanel" class="login"><h1>询盘后台</h1><p class="muted">Cloudflare Pages + D1 管理入口</p><form id="loginForm"><label>管理员密码<input id="password" type="password" autocomplete="current-password" required /></label><button class="primary" type="submit">登录 / Sign in</button><p id="loginError" class="error hidden"></p></form></section><section id="appPanel" class="hidden"><div class="toolbar"><div><h1>询盘列表</h1><p id="summary" class="muted">正在加载…</p></div><div class="filters"><select id="statusFilter"><option value="">全部状态</option><option value="new">新询盘</option><option value="contacted">已联系</option><option value="qualified">已资格审查</option><option value="closed">已关闭</option></select><button id="refresh">刷新</button></div></div><div class="table-wrap"><table><thead><tr><th>时间</th><th>联系人</th><th>市场</th><th>买家类型</th><th>留言</th><th>状态</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty hidden">暂无询盘</div></div></section></main>
  <script>
    const $=s=>document.querySelector(s),loginPanel=$('#loginPanel'),appPanel=$('#appPanel'),logout=$('#logout'),rows=$('#rows'),empty=$('#empty'),summary=$('#summary');
    const labels={new:'新询盘',contacted:'已联系',qualified:'已资格审查',closed:'已关闭'};
    async function api(path,options){const r=await fetch(path,options);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.code||'request_failed');return d}
    async function load(){const d=await api('/api/admin/inquiries?status='+encodeURIComponent($('#statusFilter').value));rows.innerHTML='';empty.classList.toggle('hidden',d.inquiries.length>0);summary.textContent=`共 ${d.inquiries.length} 条 / ${d.inquiries.length} inquiries`;d.inquiries.forEach(item=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${new Date(item.created_at+'Z').toLocaleString()}</td><td><strong>${escapeHtml(item.name)}</strong><br><a href="mailto:${escapeHtml(item.email)}">${escapeHtml(item.email)}</a></td><td>${escapeHtml(item.market)}</td><td>${escapeHtml(item.buyer)}</td><td class="message">${escapeHtml(item.message)}</td><td><select data-id="${item.id}" class="status"><option value="new">新询盘</option><option value="contacted">已联系</option><option value="qualified">已资格审查</option><option value="closed">已关闭</option></select></td>`;tr.querySelector('select').value=item.status;rows.appendChild(tr)});rows.querySelectorAll('.status').forEach(s=>s.addEventListener('change',async()=>{await api('/api/admin/inquiries',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({id:Number(s.dataset.id),status:s.value})});}));}
    const escapeHtml=v=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    async function start(){try{const d=await api('/api/admin/session');if(d.authenticated){loginPanel.classList.add('hidden');appPanel.classList.remove('hidden');logout.classList.remove('hidden');await load();}}catch{}}
    $('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginError').classList.add('hidden');try{await api('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('#password').value})});loginPanel.classList.add('hidden');appPanel.classList.remove('hidden');logout.classList.remove('hidden');await load();}catch(err){$('#loginError').textContent='登录失败，请检查密码或后台配置。';$('#loginError').classList.remove('hidden');}});
    $('#refresh').addEventListener('click',()=>load().catch(()=>{}));$('#statusFilter').addEventListener('change',()=>load().catch(()=>{}));logout.addEventListener('click',async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()});start();
  </script>
</body>
</html>
